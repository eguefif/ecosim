# Production Swarm stack: the Phoenix release built from ./Dockerfile, backed by
# an external (Scaleway) Postgres. Secrets must exist in the swarm beforehand:
#
#   printf '%s' 'ecto://USER:PASS@HOST:5432/DB' | docker secret create database_url -
#   mix phx.gen.secret | tr -d '\n' | docker secret create secret_key_base -
#
# Deploy (stack deploy does not read .env files, so export the vars first):
#
#   docker login ghcr.io
#   set -a && . ./.env.prod && set +a
#   docker stack deploy --with-registry-auth -c docker-compose.prod.yml ecosim

services:
  app:
    image: ghcr.io/eguefif/ecosim:latest
    # Run pending migrations, then replace the shell with the release.
    command: ["sh", "-c", "/app/bin/migrate && exec /app/bin/server"]
    init: true
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      SECRET_KEY_BASE_FILE: /run/secrets/secret_key_base
      PHX_HOST: "localhost"
      PORT: 4000
      POOL_SIZE: ${POOL_SIZE:-10}
    secrets:
      - database_url
      - secret_key_base
    ports:
      - "80:4000"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        order: start-first
        failure_action: rollback

secrets:
  database_url:
    external: true
  secret_key_base:
    external: true
